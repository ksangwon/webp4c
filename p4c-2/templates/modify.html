{% extends 'base.html' %}

{% block content %}
    <h3>글 수정</h3>
    <form action="{{ url_for('modify', id=post.id) }}" method="POST">
        <div>
            제목:<br>
            <input type="text" name="title" value="{{ post.title }}" required maxlength="100" style="width: 400px;"><br><br>
        </div>
        <div>
            내용:<br>
            <textarea name="content" rows="10" required maxlength="5000" style="width: 400px;">{{ post.content }}</textarea><br><br>
        </div>
        <button type="submit">수정</button>
        <a href="{{ url_for('index') }}"><button type="button">목록으로</button></a>
    </form>
{% endblock %}4
