{% extends 'base.html' %}

{% block content %}
    <h3>새 글 작성</h3>
    <form action="{{ url_for('write') }}" method="POST">
        <div>
            제목:<br>
            <input type="text" name="title" required style="width: 400px;"><br><br>
        </div>
        <div>
            내용:<br>
            <textarea name="content" rows="10" required style="width: 400px;"></textarea><br><br>
        </div>
        <button type="submit">등록</button>
        <a href="{{ url_for('index') }}"><button type="button">목록으로</button></a>
    </form>
{% endblock %}
