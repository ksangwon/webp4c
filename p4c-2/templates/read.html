{% extends 'base.html' %}

{% block content %}
    <h2>{{ post.title }}</h2>
    <p>
        <b>작성자:</b> {{ post.username }} | 
        <b>작성일:</b> {{ post.created_at.strftime('%Y-%m-%d %H:%M') }}
    </p>
    <hr>
    <div style="white-space: pre-wrap; margin-bottom: 20px;">{{ post.content }}</div>
    
    <a href="{{ url_for('index') }}"><button>목록으로</button></a>

    {% if session.get('user_id') == post.user_id %}
        <form action="{{ url_for('delete', id=post.id) }}" method="POST" style="display: inline;">
            <button type="submit" style="color: red;" onclick="return confirm('정말 삭제하시겠습니까?');">글 삭제</button>
        </form>
    {% endif %}
{% endblock %}
